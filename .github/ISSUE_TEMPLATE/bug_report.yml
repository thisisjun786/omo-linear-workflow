name: Bug report
description: Something OLW does that doesn't match its documented behavior.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Strip API keys, management keys, OAuth tokens and anything from `~/.config/cliproxyapi/` before pasting logs or config.

  - type: input
    id: version
    attributes:
      label: OLW version
      description: The `version` in `package.json`, or the commit SHA if you're on an unreleased checkout.
      placeholder: "0.1.0 or 0402e81"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, Bun, pnpm, Node and git versions. Add Rust and Zig versions if the problem is in the Herdr build. Add the OMO and CLIProxyAPI versions if the problem is in the proxy extension or routing.
      placeholder: |
        Linux x64 (Ubuntu 24.04)
        bun 1.4.0, pnpm 10.33.3, node 24.20.0, git 2.47
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands in order. Use `--fixture` and the QA scripts where possible so nobody has to touch a real Linear workspace to reproduce.
      placeholder: |
        1. bun run build
        2. bun run cli -- scope import --file tests/fixtures/scope.json --fixture --json
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected, and where it's documented if you know.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead. Include the exit code if the CLI returned one.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and output (redacted)
      description: Relevant terminal output, `doctor --json` output, or `status --json`. Keys and tokens removed.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Running Herdr server state, whether existing sessions were involved, workarounds you tried.
