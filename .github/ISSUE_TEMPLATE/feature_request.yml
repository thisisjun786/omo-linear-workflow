name: Feature request
description: A problem you want OLW to solve, or a change to how it works.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and what gets in the way today. Concrete situations beat abstract ones.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be true after the change. Describe behavior, not implementation, unless you already have a design in mind.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Which part of OLW this touches (CLI, Herdr runtime, model routing, skills, docs), and anything it must not change. Check AGENTS.md if you're unsure whether it conflicts with an existing contract.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Workarounds you use now or approaches you rejected.
