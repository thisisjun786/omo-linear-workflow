name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.3
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'patches/senpi-mcp-optional-types.patch') }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned action commit)
        with:
          toolchain: 1.96.1
          components: rustfmt
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - name: Cache Cargo downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: herdr-cargo-linux-x64-1.96.1-${{ hashFiles('vendor/herdr/manifest.json') }}
      - name: Install source dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release metadata
        run: bun run release:check
      - name: Check TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      # build invokes the pinned Herdr source preparation, Rust fmt/tests and Zig release build.
      - name: Build including managed Herdr
        run: bun run build
      - name: Smoke-test isolated local installation
        run: |
          bun run install:local -- --bin-dir "$RUNNER_TEMP/olw-bin"
          "$RUNNER_TEMP/olw-bin/olw" --help
