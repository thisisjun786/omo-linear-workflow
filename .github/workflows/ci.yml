name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Push runs are release evidence for their exact commit: a group of their own, never cancelled.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Reject pull requests into main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          echo '::error::Pull requests must target dev; releases alone advance main.'
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.3
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'patches/senpi-mcp-optional-types.patch') }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: Cache official Herdr release
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .omo/herdr/bin
          key: herdr-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('herdr-release.json') }}
      - name: Install source dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release metadata
        run: bun run release:check
      - name: Check TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      # Every build verifies the pinned release checksum, including restored caches.
      - name: Build including managed Herdr
        run: bun run build
      - name: Smoke-test isolated local installation
        run: |
          bun run install:local -- --bin-dir "$RUNNER_TEMP/olw-bin"
          "$RUNNER_TEMP/olw-bin/olw" --help
