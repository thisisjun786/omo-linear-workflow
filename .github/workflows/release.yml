name: Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on dev with successful push CI
        required: true
        type: string
      version:
        description: Version without v prefix, such as 0.2.0 or 0.2.0-rc.1
        required: true
        type: string
      dry_run:
        description: Validate only; do not create a tag, release, or update main
        default: true
        type: boolean
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.sha }}
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require repository owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "$ACTOR" != "$OWNER" ]]; then
            echo '::error::Only the repository owner may authorize a release.'
            exit 1
          fi

  validate:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: Validate source, CI, version, and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: scripts/release-publish.sh validate

  publish:
    needs: validate
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require dedicated release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo '::error::Configure RELEASE_TOKEN with Contents and Workflows read/write and Actions read.'
            exit 1
          fi
      - name: Checkout the requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: Revalidate, tag, publish, and fast-forward main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: scripts/release-publish.sh publish
